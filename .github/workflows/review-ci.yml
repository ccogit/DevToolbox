name: DevToolbox Review CI

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Maven test and package (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify tests and shaded package
        run: mvn -B -ntp clean test package -Dmaven.compiler.release=${{ matrix.java }}

  benchmark:
    name: CLI baseline versus review (JDK 25)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build unchanged main branch in a separate working tree
        run: |
          git worktree add --detach "$RUNNER_TEMP/devtoolbox-main" origin/main
          cd "$RUNNER_TEMP/devtoolbox-main"
          mvn -B -ntp -DskipTests package
      - name: Build review branch for CLI benchmark
        run: mvn -B -ntp -DskipTests package
      - name: Benchmark existing fixtures and 5000-file, 200 MB synthetic project
        run: |
          python3 review/benchmark_cli.py \
            --baseline "$RUNNER_TEMP/devtoolbox-main/target/devtoolbox.jar" \
            --baseline-repo "$RUNNER_TEMP/devtoolbox-main" \
            --current "$GITHUB_WORKSPACE/target/devtoolbox.jar" \
            --current-repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/devtoolbox-benchmark"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-benchmark-results
          path: ${{ runner.temp }}/devtoolbox-benchmark/results.json
          if-no-files-found: warn

  screenshots:
    name: Swing screenshots at two resolutions
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build UI application and capture all four pages
        run: |
          mvn -B -ntp -DskipTests package
          javac -d "$RUNNER_TEMP" review/UiScreenshot.java
          mkdir -p "$RUNNER_TEMP/devtoolbox-screenshots" "$RUNNER_TEMP/devtoolbox-ui-home"
          for resolution in 1360x1000 980x640; do
            for page in ausfuehren projekt basisdaten hilfe; do
              export PAGE="$page"
              export OUT="$RUNNER_TEMP/devtoolbox-screenshots/\${page}-\${resolution}.png"
              xvfb-run -a -s "-screen 0 \${resolution}x24" bash -c '
                set -e
                java -Duser.home="$RUNNER_TEMP/devtoolbox-ui-home" \
                     -Ddevtoolbox.page="$PAGE" -jar target/devtoolbox.jar \
                     > "$RUNNER_TEMP/devtoolbox-ui-\${PAGE}.log" 2>&1 &
                app=$!
                trap "kill $app 2>/dev/null || true" EXIT
                sleep 3
                java -cp "$RUNNER_TEMP" UiScreenshot "$OUT"
              '
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-ui-screenshots
          path: ${{ runner.temp }}/devtoolbox-screenshots/
          if-no-files-found: warn
