name: DevToolbox Review CI

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Maven test and package (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify tests and shaded package
        run: mvn -B -ntp clean test package -Dmaven.compiler.release=${{ matrix.java }}

  benchmark:
    name: CLI baseline versus review (JDK 25)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build unchanged main branch in a separate working tree
        run: |
          git worktree add --detach "$RUNNER_TEMP/devtoolbox-main" origin/main
          cd "$RUNNER_TEMP/devtoolbox-main"
          mvn -B -ntp -DskipTests package
      - name: Build review branch for CLI benchmark
        run: mvn -B -ntp -DskipTests package
      - name: Benchmark existing fixtures and 5000-file, 200 MB synthetic project
        run: |
          python3 review/benchmark_cli.py \
            --baseline "$RUNNER_TEMP/devtoolbox-main/target/devtoolbox.jar" \
            --baseline-repo "$RUNNER_TEMP/devtoolbox-main" \
            --current "$GITHUB_WORKSPACE/target/devtoolbox.jar" \
            --current-repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/devtoolbox-benchmark"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-benchmark-results
          path: ${{ runner.temp }}/devtoolbox-benchmark/results.json
          if-no-files-found: warn

  screenshots:
    name: Swing screenshots at two resolutions
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build UI application and capture all four pages
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests package
          javac -d "$RUNNER_TEMP" review/UiScreenshot.java
          mkdir -p "$RUNNER_TEMP/devtoolbox-screenshots" "$RUNNER_TEMP/devtoolbox-ui-home"
          for resolution in 1360x1000 980x640; do
            Xvfb :77 -screen 0 "${resolution}x24" -ac -nolisten tcp               > "$RUNNER_TEMP/xvfb-${resolution}.log" 2>&1 &
            xvfb=$!
            export DISPLAY=:77
            sleep 2
            if ! kill -0 "$xvfb" 2>/dev/null || ! test -S /tmp/.X11-unix/X77; then
              echo "Virtual X11 display failed for $resolution:"
              cat "$RUNNER_TEMP/xvfb-${resolution}.log"
              exit 1
            fi
            for page in ausfuehren projekt basisdaten hilfe; do
              output="$RUNNER_TEMP/devtoolbox-screenshots/${page}-${resolution}.png"
              java -Duser.home="$RUNNER_TEMP/devtoolbox-ui-home"                    -Ddevtoolbox.page="$page" -jar target/devtoolbox.jar                    > "$RUNNER_TEMP/devtoolbox-ui-${page}.log" 2>&1 &
              app=$!
              sleep 3
              if ! kill -0 "$app" 2>/dev/null; then
                echo "UI process terminated for page $page:"
                cat "$RUNNER_TEMP/devtoolbox-ui-${page}.log"
              fi
              java -cp "$RUNNER_TEMP" UiScreenshot "$output"
              kill "$app" 2>/dev/null || true
              wait "$app" 2>/dev/null || true
            done
            kill "$xvfb" 2>/dev/null || true
            wait "$xvfb" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-ui-screenshots
          path: ${{ runner.temp }}/devtoolbox-screenshots/
          if-no-files-found: warn

  overlay:
    name: Validate downloadable overlay against fresh main
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Create complete-file overlay from changed and new files
        run: |
          set -euo pipefail
          overlay="$RUNNER_TEMP/devtoolbox-overlay"
          mkdir -p "$overlay"
          git diff --name-only --diff-filter=ACMRT origin/main...HEAD > "$RUNNER_TEMP/review-file-list.txt"
          while IFS= read -r path; do
            mkdir -p "$overlay/$(dirname "$path")"
            cp -- "$path" "$overlay/$path"
          done < "$RUNNER_TEMP/review-file-list.txt"
          test -s "$overlay/CHANGES.md"
          test -s "$overlay/review/REVIEW-2026-11-11.md"
          (cd "$overlay" && zip -q -r "$RUNNER_TEMP/devtoolbox-review-2026-11-11.zip" .)
          unzip -t "$RUNNER_TEMP/devtoolbox-review-2026-11-11.zip"
          echo "Overlay files:"
          cat "$RUNNER_TEMP/review-file-list.txt"
      - name: Unzip onto fresh main and run clean tests and package
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/devtoolbox-overlay-check" origin/main
          cd "$RUNNER_TEMP/devtoolbox-overlay-check"
          unzip -q -o "$RUNNER_TEMP/devtoolbox-review-2026-11-11.zip"
          mvn -B -ntp clean test
          mvn -B -ntp package
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: devtoolbox-review-2026-11-11
          path: ${{ runner.temp }}/devtoolbox-review-2026-11-11.zip
          if-no-files-found: error
