name: DevToolbox application tests
on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/app-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/app-tests.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify application and tests
        run: mvn -B -ntp verify
