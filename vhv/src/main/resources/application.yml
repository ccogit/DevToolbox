spring:
  application:
    name: vhv-referenzmigration
  datasource:
    url: jdbc:h2:mem:vhv;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  batch:
    jdbc:
      initialize-schema: always
    job:
      name: vhvMigrationJob
      enabled: false  # Start nur bewusst mit --spring.batch.job.enabled=true
logging:
  level:
    org.springframework.batch: INFO

